<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header id="top-bar">

    <div id="top-coins">
        <span id="coins">0</span> $
    </div>

    <!-- TOOLTIP -->
    <div id="settings-tooltip">
         Aquí gestionas partidas y ajustes →
    </div>

    <!-- ⚙️ AJUSTES -->
    <div id="settings-button">⚙️</div>

</header>



<div id="settings-panel" class="hidden">

    <h3>Ajustes</h3>

    <button onclick="exportSave()">💾 Guardar partida</button>
    <button onclick="importSave()">📂 Cargar partida</button>
    <button onclick="newGame()">🆕 Nueva partida</button>

    <input type="file"
           id="importFile"
           accept=".json"
           style="display:none">

</div>

<!-- LAYOUT PRINCIPAL -->
<div id="main-layout">

    <!-- ZONA IZQUIERDA -->
    <div id="left-side">

        <!-- BOTÓN CENTRAL -->
        <div id="center-area">

            <button id="coin-button">💰</button>

        </div>

        <!-- FILA INFERIOR -->
        <div id="bottom-row">

            <!-- LOGROS -->
            <div id="achievement-box">

                <div id="achievement-button">🏆</div>

            </div>

            <!-- PRESTIGE -->
            <div id="prestige-container">

                <div id="prestige-info">

                    <div class="prestige-stat">
                        Prestige Points:
                        <span id="prestigePoints">0</span>
                    </div>

                    <div class="prestige-separator">|</div>

                    <div class="prestige-stat">
                        Skill Points:
                        <span id="prestige-skill-points">0</span>
                    </div>

                    <div class="prestige-separator">|</div>

                    <div class="prestige-stat">
                        Next:
                        <span id="prestigeRequirement">0</span>
                    </div>

                    <button id="prestige-button">
                        Prestige
                    </button>

                </div>

                <div id="prestige-progress-container">
                    <div id="prestige-progress"></div>
                </div>

            </div>

        </div>

    </div>

    <!-- PANEL DERECHO -->
    <aside id="right-panel">

        <div id="tabs">

            <button class="tab-button active"
                    onclick="showTab('upgrades-tab')">
                Mejoras
            </button>

            <button class="tab-button"
                    onclick="showTab('stats-tab')">
                Estadísticas
            </button>

        </div>

        <!-- UPGRADES -->
        <div id="upgrades-tab"
             class="tab-content active">

            <h2>Mejoras</h2>

            <div id="upgrade-list"></div>

        </div>

        <!-- STATS -->
        <div id="stats-tab" class="tab-content">

            <h2>Estadísticas</h2>

            <p>Total Clicks:
                <span id="stat-clicks">0</span>
            </p>

            <p>Coins por Click:
                <span id="stat-cpc">0</span>
            </p>

            <p>Coins/s:
                <span id="stat-cps">0</span>
            </p>

            <p>Total Coins:
                <span id="stat-total">0</span>
            </p>

            <p>Prestige Points:
                <span id="stat-prestige">0</span>
            </p>

            <p>Prestigios:
                <span id="stat-resets">0</span>
            </p>

        </div>

    </aside>

</div>

<!-- PANEL LOGROS -->
<div id="achievement-panel"
     class="hidden">
</div>

<script src="script.js"></script>

</body>
</html>
